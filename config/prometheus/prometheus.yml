## Prometheus scrape configuration. Real target IPs/hostnames are NEVER hardcoded
## here — they live in gitignored config/prometheus/targets/*.json files
## (file_sd_configs), generated from .env by scripts/bootstrap-monitoring-vm.sh.
## Only *.json.example is tracked in git. See docs/deployment-guide.md.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: "proxmox-biome"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cv4pve-metrics-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["cv4pve-metrics-exporter:9221"]

  ## Proxmox VE / Ceph node-level exporters, running directly on each cluster
  ## node (installed via scripts/node-setup/*.sh), reached over the internal
  ## management LAN — not through Traefik.
  - job_name: proxmox-node-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/proxmox-nodes.json
        refresh_interval: 5m

  - job_name: ceph-mgr-prometheus
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/ceph-mgr.json
        refresh_interval: 5m

  ## Self-monitoring of this VM's own Docker stack.
  - job_name: docker-socket-proxy
    static_configs:
      - targets: ["docker-socket-proxy:2375"]
    metrics_path: /metrics
