## Minimal static file server for cv4pve-diag HTML/JSON compliance reports.
## Auth (basic-auth or oauth2-proxy) is enforced by Traefik in front of this —
## this config only needs to serve files safely, not authenticate.
worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html/reports;

    autoindex on;
    autoindex_exact_size off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
