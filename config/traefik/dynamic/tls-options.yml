## Modern TLS profile (Mozilla "modern" baseline, TLS 1.3 preferred, TLS 1.2 minimum
## for older admin browsers). See docs/hardening.md#tls.

tls:
  ## Internal CA instead of Let's Encrypt, for a BASE_DOMAIN that is not
  ## publicly resolvable (ACME HTTP-01 can't reach it). Put the certificate
  ## (wildcard *.BASE_DOMAIN, or one SAN per hostname, full chain) and its key
  ## in config/traefik/certs/ (mounted read-only at /certs, gitignored), then
  ## uncomment these three lines, keeping their indentation under `tls:`.
  ## See docs/deployment-guide.md#tls-certificates.
  # certificates:
  #   - certFile: /certs/monitoring-vm.crt
  #     keyFile: /certs/monitoring-vm.key

  options:
    modern:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences:
        - X25519
        - CurveP256
      sniStrict: true
