## Traefik static configuration.
## Only entrypoints 80 and 443 are ever bound to the host's external interface —
## every other service in this stack is reached exclusively through Traefik.
## See docs/network-port-matrix.md and docs/hardening.md.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

## Backs the `traefik healthcheck` CLI command used by docker-compose's
## HEALTHCHECK for this service. Bound to localhost:8080 inside the container
## only — never exposed via an entrypoint/router, so it never leaves the
## container network namespace.
ping:
  entryPoint: traefik

entryPoints:
  ## Internal-only: backs `ping`/`api`. Not published in docker-compose.yml's
  ## `ports:` list, so it's unreachable outside the container network.
  traefik:
    address: ":8080"
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      middlewares:
        - security-headers@file
      tls:
        options: modern@file

providers:
  docker:
    endpoint: "tcp://docker-socket-proxy:2375"
    exposedByDefault: false
    network: monitoring-edge
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
  format: json

accessLog:
  format: json
  bufferingSize: 100
  filters:
    statusCodes:
      - "400-599"

## `acme.email` is deliberately NOT set here: Traefik's static config file does
## NOT support ${VAR} substitution (unlike the dynamic file provider or
## docker-compose.yml). It's supplied instead via the native
## TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL environment variable
## on the traefik service in docker-compose.yml. See
## https://doc.traefik.io/traefik/reference/static-configuration/env/
certificatesResolvers:
  letsencrypt:
    acme:
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
