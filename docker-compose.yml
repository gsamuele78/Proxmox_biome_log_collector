## Proxmox Biome Observability & Compliance Stack — core services.
## Hardening baseline applied to every service (see docs/hardening.md):
##   pinned image tags, cap_drop: [ALL] + minimal re-adds, no-new-privileges,
##   read_only root fs + explicit tmpfs/volumes, non-root user where the
##   upstream image supports it, resource limits, healthchecks, log rotation,
##   restart: unless-stopped, no host ports published except Traefik 80/443
##   and Loki's 3100 log-ingest port (bound to LOKI_BIND_ADDR — the
##   management-LAN interface — so PVE nodes' Alloy agents can push logs).
##
## Two internal networks: `edge` (Traefik + docker-socket-proxy + anything
## Traefik proxies to) and `backend` (Prometheus/Loki/Alertmanager/exporters).
## Services that Traefik routes to join both; nothing else touches `edge`.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *default-logging
  restart: unless-stopped

networks:
  edge:
    name: monitoring-edge
    # Fixed subnet (not Docker's default auto-assignment) so the host nftables
    # rule in scripts/configure-pdm-firewall.sh can allow-list it by address.
    # If you change this, update that script's EDGE_SUBNET to match.
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend:
    name: monitoring-backend

volumes:
  traefik-acme:
  traefik-logs:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  cv4pve-diag-reports:

services:
  # ---------------------------------------------------------------------------
  # Edge: reverse proxy + scoped Docker API access
  # ---------------------------------------------------------------------------

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    <<: *default-hardening
    environment:
      # Minimum Traefik's Docker provider needs to discover containers and
      # watch for changes — everything else stays at the image's secure-by-
      # default 0. See https://github.com/Tecnativa/docker-socket-proxy#readme
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      SERVICES: "0"
      TASKS: "0"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    read_only: true
    tmpfs:
      - /run
      # The entrypoint renders /tmp/haproxy.cfg at start; without this the
      # read-only root makes it crash-loop and Traefik discovers no routes.
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  traefik:
    image: traefik:v3.7.9
    <<: *default-hardening
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - docker-socket-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Traefik's static config file cannot expand ${VAR} itself — this native
      # TRAEFIK_* env var is how ACME_EMAIL actually reaches the ACME resolver.
      # See config/traefik/traefik.yml.
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: "${ACME_EMAIL}"
      # Read by the file provider's Go templating ({{ env "BASE_DOMAIN" }})
      # in config/traefik/dynamic/pdm.yml — the file provider does NOT
      # expand ${VAR} syntax.
      BASE_DOMAIN: "${BASE_DOMAIN}"
    extra_hosts:
      # Lets Traefik reach the natively-installed PDM on the host — see
      # ADR-0003, config/traefik/dynamic/pdm.yml, and
      # scripts/configure-pdm-firewall.sh (the actual isolation mechanism).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/letsencrypt
      - traefik-logs:/var/log/traefik
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${BASE_DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=security-headers@file,basic-auth@file"

  # ---------------------------------------------------------------------------
  # Metrics: Prometheus + Alertmanager + exporters
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.13.2
    <<: *default-hardening
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.external-url=https://prometheus.${BASE_DOMAIN}/
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - ./config/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${BASE_DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prometheus.middlewares=security-headers@file,basic-auth@file"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  alertmanager:
    image: prom/alertmanager:v0.33.1
    <<: *default-hardening
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://alertmanager.${BASE_DOMAIN}/
    volumes:
      # Rendered from alertmanager.yml.tmpl by scripts/bootstrap-monitoring-vm.sh
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alertmanager.${BASE_DOMAIN}`)"
      - "traefik.http.routers.alertmanager.entrypoints=websecure"
      - "traefik.http.routers.alertmanager.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alertmanager.middlewares=security-headers@file,basic-auth@file"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"

  node-exporter:
    image: prom/node-exporter:v1.12.1
    <<: *default-hardening
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - backend
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9100/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M

  cv4pve-metrics-exporter:
    build:
      context: ./docker/cv4pve-metrics-exporter
    image: proxmox-biome/cv4pve-metrics-exporter:2.0.0
    <<: *default-hardening
    user: "65532:65532"
    # The final image is distroless — no shell, so it can't do its own
    # ${VAR} expansion of a combined --api-token flag. Instead the whole
    # argv is built here by `docker compose`'s OWN interpolation (reading
    # .env), then passed to the binary as a fixed exec-form array. See
    # docker/cv4pve-metrics-exporter/Dockerfile and ADR-0007.
    # --host/--api-token/--settings-file are root-level options, so they go
    # before the `run` subcommand (upstream's documented argument order).
    command:
      - --host=${CV4PVE_EXPORTER_HOSTS}
      - --api-token=${PVE_API_TOKEN_ID}=${PVE_API_TOKEN_SECRET}
      - --settings-file=/etc/cv4pve/settings.json
      - run
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    # No container-level HEALTHCHECK: the final image is distroless (no shell,
    # no wget/curl to run as a probe command). Health is observed externally
    # via Prometheus's own `up{job="cv4pve-metrics-exporter"}` scrape metric
    # and the ProxmoxNodeDown-style alerting — see docs/hardening.md.
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M

  # ---------------------------------------------------------------------------
  # Logs & dashboards
  # ---------------------------------------------------------------------------

  loki:
    image: grafana/loki:3.7.4
    <<: *default-hardening
    command:
      - -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    # The ONE non-Traefik published port: PVE nodes' Alloy agents push logs
    # here over the management LAN (docs/network-port-matrix.md, zone 2).
    # Bind it to the monitoring VM's management-LAN address via
    # LOKI_BIND_ADDR so it is never exposed on the perimeter-facing NIC.
    ports:
      - "${LOKI_BIND_ADDR:-0.0.0.0}:3100:3100"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # Loki 3.x ships on distroless/static (no shell, no wget) — use the
      # binary's own built-in probe against /ready instead.
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    image: grafana/grafana-oss:13.0.2
    <<: *default-hardening
    environment:
      GF_SERVER_ROOT_URL: "https://grafana.${BASE_DOMAIN}/"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${BASE_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.middlewares=security-headers@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # ---------------------------------------------------------------------------
  # NIS2 compliance auditing (cv4pve-diag) — one-shot, triggered by a host
  # systemd timer (scripts/systemd/cv4pve-diag.{service,timer}) running
  # `docker compose run --rm cv4pve-diag`, NOT an in-container scheduler.
  # profiles: ["tools"] keeps it out of `docker compose up -d`.
  # ---------------------------------------------------------------------------

  cv4pve-diag:
    build:
      context: ./docker/cv4pve-diag
    image: proxmox-biome/cv4pve-diag:2.4.0
    profiles:
      - tools
    <<: *default-hardening
    user: "65532:65532"
    # Default argv for ad-hoc `docker compose run --rm cv4pve-diag` testing.
    # The scheduled path (scripts/systemd/cv4pve-diag.timer ->
    # scripts/run-cv4pve-diag.sh) overrides this with a timestamped
    # --output-file instead — see that script. Same shell-less-image
    # reasoning as cv4pve-metrics-exporter above.
    # All of these are root-level options, so they precede the `execute`
    # subcommand (upstream's documented argument order).
    command:
      - --host=${CV4PVE_DIAG_HOSTS}
      - --api-token=${PVE_API_TOKEN_ID}=${PVE_API_TOKEN_SECRET}
      - --compliance=Nis2
      - --output=Html
      - --output-file=/reports/latest.html
      - execute
    volumes:
      - cv4pve-diag-reports:/reports
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp

  audit-report-server:
    image: nginxinc/nginx-unprivileged:1.31.3-alpine3.24
    <<: *default-hardening
    volumes:
      - ./config/audit-report-server/nginx.conf:/etc/nginx/nginx.conf:ro
      - cv4pve-diag-reports:/usr/share/nginx/html/reports:ro
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first and nginx
      # listens on IPv4 only, so "localhost" is refused.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audit-reports.rule=Host(`audit.${BASE_DOMAIN}`)"
      - "traefik.http.routers.audit-reports.entrypoints=websecure"
      - "traefik.http.routers.audit-reports.tls.certresolver=letsencrypt"
      - "traefik.http.routers.audit-reports.middlewares=security-headers@file,basic-auth@file"
      - "traefik.http.services.audit-reports.loadbalancer.server.port=8080"

  # ---------------------------------------------------------------------------
  # Phase 2: Keycloak SSO forwardAuth. Not started by default — see
  # docs/keycloak-integration.md. Bring up with:
  #   docker compose --profile keycloak up -d
  # then flip the `basic-auth@file` middleware references above to
  # `oauth2-proxy-auth@file` once verified working.
  # ---------------------------------------------------------------------------

  oauth2-proxy:
    # -alpine flavour: the default tag is distroless (no wget), which would
    # make the healthcheck below fail forever.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3-alpine
    profiles:
      - keycloak
    <<: *default-hardening
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: "${KEYCLOAK_ISSUER_URL}"
      OAUTH2_PROXY_CLIENT_ID: "${KEYCLOAK_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET}"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # ForwardAuth mode: no real upstream — answer 202 when the session is
      # valid, redirect to Keycloak otherwise. See the oauth2-proxy-auth
      # middleware in config/traefik/dynamic/middlewares.yml.
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      # One session cookie for every *.BASE_DOMAIN service, and allow
      # post-login redirects back to any of them.
      OAUTH2_PROXY_COOKIE_DOMAINS: ".${BASE_DOMAIN}"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".${BASE_DOMAIN}"
      # PKCE on the authorization-code flow (Keycloak supports S256).
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: "S256"
      # Only Traefik (monitoring-edge subnet) may set X-Forwarded-*; without
      # this every client IP is trusted to spoof them.
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: "172.28.0.0/24"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:4180/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M
    labels:
      # oauth2-proxy's own endpoints (/oauth2/start, /oauth2/callback, ...)
      # must be reachable on EVERY protected hostname, or the Keycloak
      # callback lands on the protected backend instead and login loops.
      # High priority so it wins over each service's Host() router.
      - "traefik.enable=true"
      - "traefik.http.routers.oauth2-proxy.rule=PathPrefix(`/oauth2/`)"
      - "traefik.http.routers.oauth2-proxy.priority=1000"
      - "traefik.http.routers.oauth2-proxy.entrypoints=websecure"
      - "traefik.http.routers.oauth2-proxy.tls=true"
      - "traefik.http.routers.oauth2-proxy.middlewares=security-headers@file"
      - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"
