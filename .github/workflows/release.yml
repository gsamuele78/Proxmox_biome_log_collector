name: Release

# Pushing a vX.Y.Z tag publishes a GitHub Release whose notes are the
# matching "## [X.Y.Z]" section of CHANGELOG.md. The README's release badge
# reads from it, so the badge and the changelog cannot drift apart.
on:
  push:
    tags: ["v*.*.*"]
  # For a tag pushed before this workflow existed (e.g. v0.2.0).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [[ ! -s /tmp/notes.md ]]; then
            echo "CHANGELOG.md has no '## [${version}]' section" >&2
            exit 1
          fi
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "${TAG}" --title "${TAG#v}" \
            --notes-file /tmp/notes.md --verify-tag
