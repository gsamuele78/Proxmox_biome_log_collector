name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, catches newly-disclosed CVEs in already-merged pinned images —
    # not just at PR time. Off-peak, off-the-hour per repo convention.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trivy config/misconfig scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  trivy-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build custom images
        # cv4pve-diag sits in the `tools` profile; without --profile it is
        # skipped and the scan below has no image to scan.
        run: |
          cp .env.example .env
          docker compose --profile tools build
      - name: Scan cv4pve-metrics-exporter image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: proxmox-biome/cv4pve-metrics-exporter:2.0.0
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Scan cv4pve-diag image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: proxmox-biome/cv4pve-diag:2.4.0
          severity: CRITICAL,HIGH
          exit-code: "1"
