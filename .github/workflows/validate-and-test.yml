name: Validate and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare throwaway .env
        run: cp .env.example .env
      - name: Validate core compose file
        run: docker compose config --quiet
      - name: Validate core + pegaprox overlay
        run: docker compose -f docker-compose.yml -f docker-compose.pegaprox.yml config --quiet

  promtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: promtool check config
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/config/prometheus:/config:ro" \
            prom/prometheus:v3.15.0 check config /config/prometheus.yml
      - name: promtool check rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/config/prometheus:/config:ro" \
            prom/prometheus:v3.15.0 check rules /config/rules/proxmox.rules.yml /config/rules/ceph.rules.yml \
            /config/rules/monitoring.rules.yml

  amtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render alertmanager.yml from template with dummy values
        run: |
          export ALERTMANAGER_SMTP_SMARTHOST=smtp.invalid:587
          export ALERTMANAGER_SMTP_FROM=alerts@smoketest.internal
          export ALERTMANAGER_SMTP_USERNAME=smoketest
          export ALERTMANAGER_SMTP_PASSWORD=smoketest
          export ALERTMANAGER_RECEIVER_EMAIL=oncall@smoketest.internal
          export ALERTMANAGER_SMTP_REQUIRE_TLS=true
          envsubst < config/alertmanager/alertmanager.yml.tmpl > /tmp/alertmanager.yml
      - name: amtool check-config
        run: |
          docker run --rm -v /tmp/alertmanager.yml:/config/alertmanager.yml:ro \
            --entrypoint amtool prom/alertmanager:v0.34.1 check-config /config/alertmanager.yml

  smoke-test:
    runs-on: ubuntu-latest
    needs: [compose-config, promtool, amtool]
    steps:
      - uses: actions/checkout@v7
      - name: Install htpasswd (used by scripts/generate-secrets.sh)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apache2-utils
      - run: tests/integration/smoke-test.sh

  # The documented deployment path (scripts/bootstrap-monitoring-vm.sh as
  # root) plus the lab's tier-0 assertions, on the runner's Docker daemon:
  # auth 401/200, HTTP->HTTPS, secret file modes, Loki bound only to
  # LOKI_BIND_ADDR, Loki push/query, Grafana datasources, rules loaded, and
  # an alert delivered by mail. The lab's management address 10.77.10.10 is
  # recreated on a dummy interface so tests/e2e/ runs unchanged.
  deploy-e2e:
    runs-on: ubuntu-latest
    needs: [compose-config, promtool, amtool]
    # A normal run takes about 3 minutes; a stuck apt or pull must not hold a
    # runner for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Host prerequisites (deployment guide + lab provisioning)
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update -qq
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y -qq apache2-utils gettext-base jq
          sudo ip link add biome-mgmt type dummy
          sudo ip addr add 10.77.10.10/24 dev biome-mgmt
          sudo ip link set biome-mgmt up
          sudo mkdir -p /var/lib/biome-lab/artifacts
          sudo ln -sfn "${GITHUB_WORKSPACE}" /opt/proxmox-biome
          docker run -d --name lab-mailpit -p 10.77.10.10:1025:1025 -p 10.77.10.10:8025:8025 \
            axllent/mailpit:v1.31.3
      - name: tests/e2e/t0-deploy.sh
        run: sudo bash tests/e2e/t0-deploy.sh
      - name: Stack logs on failure
        if: failure()
        # The stack's compose project is named after /opt/proxmox-biome.
        working-directory: /opt/proxmox-biome
        run: |
          sudo docker compose ps -a || true
          sudo docker compose logs --no-color --tail 200 || true
          sudo cat /var/lib/biome-lab/artifacts/bootstrap.log || true
