## Optional PegaProx overlay (opt-in, AGPL-3.0). This file is never read
## unless you add it explicitly:
##   docker compose -f docker-compose.yml -f docker-compose.pegaprox.yml up -d
## PegaProx is a second management UI with write access to the cluster; read
## docs/adr/0008-pegaprox-1x-opt-in-overlay.md before enabling it.
## cv4pve-diag stays the default compliance auditor.

services:
  pegaprox:
    image: ghcr.io/pegaprox/pegaprox:1.2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # Plain HTTP on :5000 for Traefik; without this PegaProx serves its own
      # self-signed HTTPS there and Traefik's HTTP backend gets garbage.
      PEGAPROX_BEHIND_PROXY: "true"
      # Traefik's address on the edge network (subnet pinned in docker-compose.yml).
      PEGAPROX_TRUSTED_PROXIES: "172.28.0.0/24"
      PEGAPROX_ALLOWED_ORIGINS: "https://pegaprox.${BASE_DOMAIN}"
    # The image's own VOLUMEs. Anything else (e.g. /data) leaves the real
    # config and database in anonymous volumes, lost on the next recreate.
    volumes:
      - pegaprox-config:/app/config
      - pegaprox-logs:/app/logs
    networks:
      - edge
      - backend
    healthcheck:
      # No wget/curl in the image (python:3.12-slim base): use Python.
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pegaprox.rule=Host(`pegaprox.${BASE_DOMAIN}`)"
      - "traefik.http.routers.pegaprox.entrypoints=websecure"
      - "traefik.http.routers.pegaprox.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pegaprox.middlewares=security-headers@file,basic-auth@file"
      - "traefik.http.services.pegaprox.loadbalancer.server.port=5000"
      # PegaProx's own docs note ports 5001 (VNC websocket) and 5002 (SSH
      # websocket) as separate optional features of its web UI proxying
      # further into guest consoles — not routed here by default since this
      # stack does not currently document/scope that use case. See
      # docs/roadmap.md if you want to extend this overlay.

volumes:
  pegaprox-config:
  pegaprox-logs:
